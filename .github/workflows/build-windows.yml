name: Test, build and publish Windows executable

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
      - "run_windows.bat"

permissions:
  contents: write

concurrency:
  group: forex-ai-desk-windows-release
  cancel-in-progress: true

jobs:
  test-build-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set version for this build
        shell: pwsh
        run: |
          $version = "0.1.$env:GITHUB_RUN_NUMBER"
          Set-Content -Path version.py -Value ('__version__ = "' + $version + '"' + "`n") -Encoding utf8
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ForexAIDesk main.py
      - name: Create SHA-256 checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/ForexAIDesk.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/ForexAIDesk.exe.sha256 -Value ($hash + "  ForexAIDesk.exe") -Encoding ascii
      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Forex AI Desk v${{ env.APP_VERSION }}
          body: |
            Build Windows automatique de Forex AI Desk.
            Les tests unitaires et la compilation sont exécutés avant la publication.
            Mode simulation uniquement; aucune transaction réelle n'est envoyée.
          files: |
            dist/ForexAIDesk.exe
            dist/ForexAIDesk.exe.sha256
          draft: false
          prerelease: false
